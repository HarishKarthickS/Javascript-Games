<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whac-a-Mole</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <h2>Your score:</h2>
    <h2 id="score">0</h2>
    <h2>Time Left:</h2>
    <h2 id="time-left">60</h2>
    <h2>Level:</h2>
    <h2 id="level">1</h2>
    <button id="restart">Restart</button>
  </div>
  <div class="grid">
    <div class="square" id="1" aria-label="Hole 1"></div>
    <div class="square" id="2" aria-label="Hole 2"></div>
    <div class="square" id="3" aria-label="Hole 3"></div>
    <div class="square" id="4" aria-label="Hole 4"></div>
    <div class="square" id="5" aria-label="Hole 5"></div>
    <div class="square" id="6" aria-label="Hole 6"></div>
    <div class="square" id="7" aria-label="Hole 7"></div>
    <div class="square" id="8" aria-label="Hole 8"></div>
    <div class="square" id="9" aria-label="Hole 9"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
